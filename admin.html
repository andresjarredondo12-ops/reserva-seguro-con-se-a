<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">
    <div class="max-w-3xl mx-auto mt-10">
        
        <!-- Pantalla de Login -->
        <div id="login-panel" class="bg-white p-6 rounded-lg shadow-md max-w-sm mx-auto">
            <h2 class="text-2xl font-bold text-center mb-6">Acceso Dueño</h2>
            <input type="email" id="email" placeholder="Correo electrónico" class="w-full mb-4 p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            <input type="password" id="password" placeholder="Contraseña" class="w-full mb-6 p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            <button id="btn-login" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">Ingresar</button>
            <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden">Datos incorrectos.</p>
        </div>

        <!-- Panel de Turnos (Oculto hasta iniciar sesión) -->
        <div id="dashboard-panel" class="hidden">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-2xl font-bold">Turnos Reservados</h2>
                <button id="btn-logout" class="bg-red-500 text-white px-4 py-2 rounded font-bold hover:bg-red-600 transition text-sm">Cerrar Sesión</button>
            </div>
            
            <div id="lista-reservas" class="grid gap-4">
                <!-- Las reservas de Firebase aparecerán aquí -->
            </div>
        </div>

    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
